
[functions.send-mass-coupon]
enabled = true
verify_jwt = false
import_map = "./functions/send-mass-coupon/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-mass-coupon/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-mass-coupon/*.html" ]

# API de Conversiones de Meta. Se desactiva la verificación JWT porque la función
# valida por su cuenta: el webhook con el secreto x-webhook-secret y el navegador
# con una lista de orígenes permitidos. Los eventos de Purchase nunca vienen del navegador.
[functions.meta-capi]
enabled = true
verify_jwt = false
entrypoint = "./functions/meta-capi/index.ts"
